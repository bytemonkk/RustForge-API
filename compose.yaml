services:
  postgres:
    image: postgres:17
    container_name: rustforge-postgres
    environment:
      POSTGRES_DB: rustforge
      POSTGRES_USER: dobby
      POSTGRES_PASSWORD: dobby00
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobby -d rustforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
